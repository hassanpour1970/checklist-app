name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch isar_flutter_libs (namespace + compileSdk)
        run: |
          find $HOME/.pub-cache -type f \( -path "*/isar_flutter_libs-*/android/build.gradle" -o -path "*/isar_flutter_libs-*/android/build.gradle.kts" \) | while read f; do
            echo "Patching $f"
            
            # اضافه کردن namespace اگر وجود ندارد
            if ! grep -q "namespace" "$f"; then
              if [[ "$f" == *.kts ]]; then
                sed -i '/android {/a\    namespace = "dev.isar.isar_flutter_libs"' "$f"
              else
                sed -i '/android {/a\    namespace "dev.isar.isar_flutter_libs"' "$f"
              fi
            fi

            # بالا بردن compileSdk به 34
            sed -i 's/compileSdkVersion 30/compileSdk 34/g' "$f"
            sed -i 's/compileSdkVersion = 30/compileSdk = 34/g' "$f"
            sed -i 's/compileSdk 30/compileSdk 34/g' "$f"
            sed -i 's/compileSdk = 30/compileSdk = 34/g' "$f"
            
            echo "→ Done"
          done

      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: checklist-app-release
          path: build/app/outputs/flutter-apk/app-release.apk