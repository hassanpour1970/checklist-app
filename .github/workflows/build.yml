name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Strong patch for isar_flutter_libs
        run: |
          echo "=== Patching isar_flutter_libs ==="
          find $HOME/.pub-cache -type f \( -path "*/isar_flutter_libs-*/android/build.gradle" -o -path "*/isar_flutter_libs-*/android/build.gradle.kts" \) | while read f; do
            echo "Processing: $f"
            
            # ۱. اضافه کردن namespace
            if ! grep -q "namespace" "$f"; then
              if [[ "$f" == *.kts ]]; then
                sed -i '/android {/a\    namespace = "dev.isar.isar_flutter_libs"' "$f"
              else
                sed -i '/android {/a\    namespace "dev.isar.isar_flutter_libs"' "$f"
              fi
              echo "  + namespace added"
            fi

            # ۲. اجبار کردن compileSdk به 34
            sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*30/compileSdk = 34/g' "$f"
            sed -i -E 's/compileSdk(Version)?[[:space:]]+30/compileSdk 34/g' "$f"
            
            # اگر اصلاً compileSdk نداشت، اضافه کن
            if ! grep -q "compileSdk" "$f"; then
              if [[ "$f" == *.kts ]]; then
                sed -i '/android {/a\    compileSdk = 34' "$f"
              else
                sed -i '/android {/a\    compileSdk 34' "$f"
              fi
              echo "  + compileSdk 34 added"
            fi

            echo "  → Finished patching"
          done

      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: checklist-app-release
          path: build/app/outputs/flutter-apk/app-release.apk