name: checklist_app
description: Multi-language checklist app with RTL support, custom checklists, and Excel export.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.7
  path_provider: ^2.1.4
  excel: ^4.0.6
  share_plus: ^10.0.2
  intl: any
  collection: any

  # === Isar Community (نسخه اصلاح‌شده) ===
  isar:
    hosted:
      name: isar
      url: https://pub.isar-community.dev/
    version: ^3.1.0+1
  isar_flutter_libs:
    hosted:
      name: isar_flutter_libs
      url: https://pub.isar-community.dev/
    version: ^3.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  isar_generator:
    hosted:
      name: isar_generator
      url: https://pub.isar-community.dev/
    version: ^3.1.0+1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
