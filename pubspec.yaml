name: checklist_app
description: Multi-language checklist app with RTL support, custom checklists, and Excel export.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.7
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4
  excel: ^4.0.6
  share_plus: ^10.0.2
  intl: any
  collection: any
  file_selector: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.12
  
flutter:
  uses-material-design: true
  assets:
    - assets/translations/
